name: Update lotto results

# Lotto draws are usually on Tuesday and Saturday nights (Israel time); run the
# night after and again the next morning in case the sources were late.
on:
  schedule:
    - cron: '30 21 * * 2,6'
    - cron: '0 5 * * 0,3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch new draws
        run: python scripts/update_results.py
      - name: Commit if changed
        run: |
          if git diff --quiet lotto.csv; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add lotto.csv
          git commit -m "data: update lotto results"
          git push

name: Update lotto results

# Lotto draws are usually on Tuesday and Saturday nights (Israel time), but holiday weeks move
# them to other days (Sun/Wed/Thu), so check every night and again every morning.
on:
  schedule:
    - cron: '45 20 * * *'
    - cron: '30 22 * * *'
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch new draws
        run: python scripts/update_results.py
      - name: Score the challenge and register the next ticket
        run: python scripts/learn.py
      - name: Commit if changed
        run: |
          git add lotto.csv learn
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update lotto results"
          git push
